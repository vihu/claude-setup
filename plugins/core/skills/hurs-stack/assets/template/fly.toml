# Rename `app` and create the volume once: `fly volumes create data --size 1`
app = "hurs-app"
primary_region = "jnb"

[build]
  dockerfile = "Dockerfile"

[env]
  DATABASE_URL = "sqlite:///data/app.db"
  RUST_LOG = "info"

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  path = "/healthz"
  interval = "30s"
  timeout = "5s"

# SQLite on one volume means exactly one machine.
[deploy]
  strategy = "immediate"
